<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPD Walkthrough</title>
<style>
  :root {
    --bg: #faf8f4;
    --panel: #ffffff;
    --ink: #4a4a46;
    --muted: #9b958a;
    --title: #8a8378;
    --cream: #f4edde;
    --cream-edge: #b2895c;
    --cream-ink: #6f5436;
    --opt-fill: #f6f3ec;
    --opt-edge: #ccc3b2;
    --opt-ink: #b3a894;
    --brown: #a9763f;
    --teal: #2f8f9d;
    --grey: #c3bdb1;
    --lane: #efece4;
    --lane-alt: #e4e0d6;
    --accent: #b2895c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px 16px 24px;
  }
  .wrap {
    max-width: 1400px;
    margin: 0 auto;
    min-height: calc(100vh - 44px);
    display: flex;
    flex-direction: column;
  }
  h1 {
    font: italic 400 20px/1.3 Georgia, "Times New Roman", serif;
    color: var(--title);
    margin: 0 0 4px;
  }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  .stage-card {
    background: var(--panel);
    border: 1px solid #ece7dd;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    padding: 10px 14px;
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
  }
  svg { width: 100%; height: 100%; display: block; }
  .panel-title { font: italic 400 12px Georgia, serif; fill: var(--title); }
  .lane-label { font: italic 400 11px Georgia, serif; fill: var(--muted); }
  .node-label { font: 600 13px -apple-system, "Segoe UI", sans-serif; }
  .bind { font: italic 400 8px Georgia, serif; fill: var(--cream-ink); }
  .fc { font: 500 8px -apple-system, sans-serif; fill: #6a7e82; }
  .agent { font: 600 8px -apple-system, sans-serif; fill: var(--teal); }
  .prod { font: italic 400 8px Georgia, serif; fill: var(--brown); }
  .caption {
    margin-top: 16px;
    min-height: 92px;
    border-left: 3px solid var(--accent);
    padding: 2px 0 2px 14px;
  }
  .cap-head { font-weight: 600; color: #5c564b; margin-bottom: 2px; }
  .cap-formula { font: italic 400 13px Georgia, serif; color: var(--muted); margin-bottom: 6px; }
  .cap-body { font-size: 13px; color: #6a655b; }
  .cap-body b { color: var(--cream-ink); font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  button {
    font: 500 13px -apple-system, sans-serif;
    color: #5c564b;
    background: #fff;
    border: 1px solid #d8d1c4;
    border-radius: 8px;
    padding: 7px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #f6f2ea; border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: default; }
  .dots { display: flex; gap: 6px; margin-left: auto; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd6c8; }
  .dot.on { background: var(--accent); }
  .seed { color: var(--muted); font-size: 12px; }
  .reroll { margin-left: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Stigmergic Project Delivery</h1>
  <p class="sub">A staged walkthrough: random specification &rarr; bound descriptors &rarr; derived process &amp; forecast &rarr; eligible resources &rarr; one contract.</p>

  <div class="stage-card">
    <svg id="diagram" viewBox="0 0 920 300" role="img" aria-label="SPD model diagram"></svg>
  </div>

  <div class="caption">
    <div class="cap-head" id="capHead"></div>
    <div class="cap-formula" id="capFormula"></div>
    <div class="cap-body" id="capBody"></div>
  </div>

  <div class="controls">
    <button id="back">&larr; Back</button>
    <button id="next">Next &rarr;</button>
    <button id="reroll" class="reroll">Reroll</button>
    <span class="seed" id="seed"></span>
    <span class="dots" id="dots"></span>
  </div>
</div>

<script src="model_bundle.js"></script>
<script>
"use strict";
const SPD = window.SPD;

/* ---- model constants (mirror business/ sampling + forecast) ---------------- */
const NUMERICAL_RANGE = { length: [100, 2000], width: [100, 1200], count: [1, 60] };
const CATEGORICAL_POOL = { colour: ["natural", "black", "white", "grey", "blue"] };
const TYPICAL = { length: 1000, width: 500, count: 20 };
const K_NEAREST = 8;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function sampleDescriptors(rng, defs) {
  const vals = {};
  for (const d of defs) {
    if (d.type === "numerical") {
      const [lo, hi] = NUMERICAL_RANGE[d.name] || [1, 100];
      vals[d.name] = d.name === "count"
        ? Math.floor(lo + rng() * (hi - lo + 1))
        : Math.round((lo + rng() * (hi - lo)) * 10) / 10;
    } else {
      const levels = d.levels || CATEGORICAL_POOL[d.name] || ["x", "y", "z"];
      vals[d.name] = levels[Math.floor(rng() * levels.length)];
    }
  }
  return vals;
}

function catMatch(query, record) {
  for (const k in query) if (typeof query[k] === "string" && record[k] !== query[k]) return false;
  return true;
}
function numDist(a, b) {
  let s = 0;
  for (const k in a) {
    if (typeof a[k] === "number" && typeof b[k] === "number") {
      const sc = TYPICAL[k] || 1;
      s += ((a[k] - b[k]) / sc) ** 2;
    }
  }
  return Math.sqrt(s);
}
function mean(xs) { return xs.reduce((p, c) => p + c, 0) / xs.length; }
function pstdev(xs) { const m = mean(xs); return Math.sqrt(mean(xs.map(x => (x - m) ** 2))); }

function forecast(step, D, records) {
  const at = records.filter(r => r.s === step);
  const matched = at.filter(r => catMatch(D, r.D));
  let pool = matched.length ? matched : at;
  if (!pool.length) return { n: 0, metrics: {} };
  pool = pool.slice().sort((x, y) => numDist(D, x.D) - numDist(D, y.D)).slice(0, K_NEAREST);
  const names = new Set();
  pool.forEach(r => Object.keys(r.M).forEach(m => names.add(m)));
  const metrics = {};
  [...names].sort().forEach(m => {
    const v = pool.filter(r => m in r.M).map(r => r.M[m]);
    metrics[m] = { mean: Math.round(mean(v) * 100) / 100, sd: v.length > 1 ? Math.round(pstdev(v) * 100) / 100 : 0 };
  });
  return { n: pool.length, metrics };
}

function deriveProject(seed) {
  const rng = mulberry32(seed);
  const spec = SPD.spec, process = SPD.process, agents = SPD.agents.agents, records = SPD.trace.records;
  const defs = {}; spec.N.forEach(n => defs[n.id] = n.D || []);
  const allNodes = spec.N.map(n => n.id);
  const mu = process.mu, req = process.J;

  // nodes that actually necessitate steps; a project must include at least one
  const stepNodes = allNodes.filter(x => (mu[x] || []).length);
  let P = allNodes.filter(() => rng() < 0.5);
  if (!P.some(x => stepNodes.includes(x))) P.push(stepNodes[Math.floor(rng() * stepNodes.length)]);
  // tree closure: a selected branch requires its ancestors up to the root
  const parent = {}; spec.A.forEach(e => parent[e.child] = e.parent);
  const closed = new Set(P);
  P.forEach(x => { let p = parent[x]; while (p) { closed.add(p); p = parent[p]; } });
  P = allNodes.filter(x => closed.has(x));
  const bindings = {}; P.forEach(x => bindings[x] = sampleDescriptors(rng, defs[x]));

  const N_P = [...new Set(P.flatMap(x => mu[x] || []))];
  const order = SPD.process.G.Ns.map(s => s.id);
  N_P.sort((a, b) => order.indexOf(a) - order.indexOf(b));

  const nodeOfStep = {};
  for (const node in mu) (mu[node] || []).forEach(s => nodeOfStep[s] = node);

  const inSet = new Set(N_P);
  const arcs = process.G.Asp.filter(e => inSet.has(e.u) && inSet.has(e.v));

  const eligibility = {}, forecasts = {}, topAgent = {};
  N_P.forEach(s => {
    eligibility[s] = agents.filter(a => a.Q.includes(req[s]))
      .map(a => ({ a: a.id, n_a: records.filter(r => r.a === a.id && r.s === s).length }))
      .sort((x, y) => y.n_a - x.n_a);
    forecasts[s] = forecast(s, bindings[nodeOfStep[s]], records);
    topAgent[s] = eligibility[s][0] ? eligibility[s][0].a : null;
  });

  const jobs = [...new Set(N_P.map(s => req[s]))].sort();
  const contracts = jobs.map(j => {
    const steps = N_P.filter(s => req[s] === j), set = new Set(steps);
    return {
      job: j, steps,
      in: arcs.filter(e => set.has(e.v) && !set.has(e.u)),
      out: arcs.filter(e => set.has(e.u) && !set.has(e.v)),
    };
  });
  // focus the job with the most steps (tie -> first)
  const focus = contracts.slice().sort((a, b) => b.steps.length - a.steps.length)[0];

  return { seed, P, bindings, N_P, nodeOfStep, arcs, eligibility, forecasts, topAgent, req, contracts, focus };
}

/* ---- layout ---------------------------------------------------------------- */
const SPEC = {
  S: { x: 36, y: 30, w: 60, h: 30 },
  A: { x: 78, y: 84, w: 60, h: 30 },
  B: { x: 78, y: 138, w: 60, h: 30 },
  C: { x: 78, y: 192, w: 60, h: 30, opt: true },
};
const LANE_Y = { S1: 80, S2: 160, S3: 240 };
const STEP = {
  p1: { bx: 330, lane: "S1" }, p2: { bx: 720, lane: "S1", opt: true },
  q1: { bx: 330, lane: "S2" }, q2: { bx: 520, lane: "S2" },
  r1: { bx: 520, lane: "S3", opt: true }, r2: { bx: 720, lane: "S3" },
};
const SW = 84, SH = 38;
const scx = id => STEP[id].bx + SW / 2;
const scy = id => LANE_Y[STEP[id].lane];
const ARC = {
  "p1_q1": { type: "teal", d: "M372,99 L372,141", mid: [380, 122] },
  "q1_q2": { type: "brown", d: "M414,160 L520,160", mid: [467, 152] },
  "q2_r2": { type: "teal", d: "M604,160 L662,160 L662,240 L720,240", mid: [670, 202] },
  "p1_p2": { type: "grey", d: "M414,80 L720,80", mid: [567, 72] },
  "r2_r1": { type: "grey", d: "M720,240 L604,240", mid: [662, 232] },
};
const STROKE = { brown: "var(--brown)", teal: "var(--teal)", grey: "var(--grey)" };

const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };

/* ---- build diagram for a project ------------------------------------------- */
let refs = {};
function buildDiagram(M) {
  const svg = document.getElementById("diagram");
  svg.innerHTML = "";
  refs = { spec: {}, bind: {}, step: {}, arc: {}, fc: {}, agent: {}, mu: [], prod: {}, process: null };

  // arrowhead markers
  const defs = el("defs");
  for (const c of ["brown", "teal", "grey"]) {
    const m = el("marker", { id: "ah-" + c, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
    m.appendChild(el("path", { d: "M0,0 L10,5 L0,10 z", fill: STROKE[c] }));
    defs.appendChild(m);
  }
  svg.appendChild(defs);

  // titles
  svg.appendChild(el("text", { x: 20, y: 18, class: "panel-title" })).textContent = "Master specification";
  const ptitle = el("text", { x: 250, y: 18, class: "panel-title" }); ptitle.textContent = "Master process, by skillset"; svg.appendChild(ptitle);

  // process panel (lanes) -- grouped so we can fade it in later stages
  const pg = el("g"); refs.process = pg; svg.appendChild(pg);
  pg.appendChild(el("rect", { x: 248, y: 40, width: 652, height: 240, rx: 8, fill: "none", stroke: "#e7e2d8" }));
  [["S1", 40, "var(--lane)"], ["S2", 120, "var(--lane-alt)"], ["S3", 200, "var(--lane)"]].forEach(([k, y, fill]) => {
    pg.appendChild(el("rect", { x: 248, y, width: 652, height: 80, fill, opacity: 0.6 }));
    const lt = el("text", { x: 262, y: y + 44, class: "lane-label" }); lt.textContent = "Skillset " + k.slice(1); pg.appendChild(lt);
  });

  // spec edges
  const spine = el("path", { d: "M66,60 V207", stroke: "var(--grey)", fill: "none", "stroke-width": 1 });
  svg.appendChild(spine);
  for (const [id, c] of [["A", 99], ["B", 153], ["C", 207]]) {
    svg.appendChild(el("path", { d: `M66,${c} H78`, stroke: "var(--grey)", fill: "none", "stroke-width": 1 }));
  }

  // mu links (spec node -> steps), drawn under nodes
  const mu = SPD.process.mu;
  M.P.forEach(x => (mu[x] || []).forEach(s => {
    if (!STEP[s]) return;
    const n = SPEC[x]; if (!n) return;
    const x0 = n.x + n.w, y0 = n.y + n.h / 2, x1 = STEP[s].bx, y1 = scy(s);
    const cxm = (x0 + x1) / 2;
    const p = el("path", { d: `M${x0},${y0} C${cxm},${y0} ${cxm},${y1} ${x1},${y1}`, stroke: "var(--cream-edge)", fill: "none", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0 });
    svg.appendChild(p); refs.mu.push({ el: p, step: s });
  }));

  // arcs
  for (const key in ARC) {
    const [u, v] = key.split("_"); const a = ARC[key];
    const p = el("path", { d: a.d, stroke: STROKE[a.type], fill: "none", "stroke-width": a.type === "brown" ? 2 : 1.5, "marker-end": `url(#ah-${a.type})` });
    if (a.type === "teal") p.setAttribute("stroke-dasharray", "5 4");
    svg.appendChild(p); refs.arc[key] = { el: p, u, v };
    const pr = el("text", { x: a.mid[0], y: a.mid[1], class: "prod", "text-anchor": "middle", opacity: 0 });
    svg.appendChild(pr); refs.prod[key] = pr;
  }

  // spec nodes + bindings
  for (const id in SPEC) {
    const n = SPEC[id];
    const g = el("g");
    const r = el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 6,
      fill: n.opt ? "var(--opt-fill)" : "var(--cream)", stroke: n.opt ? "var(--opt-edge)" : "var(--cream-edge)",
      "stroke-width": 1.2 });
    if (n.opt) r.setAttribute("stroke-dasharray", "4 3");
    g.appendChild(r);
    const t = el("text", { x: n.x + n.w / 2, y: n.y + n.h / 2 + 4, class: "node-label", "text-anchor": "middle",
      fill: n.opt ? "var(--opt-ink)" : "var(--cream-ink)" }); t.textContent = id;
    g.appendChild(t);
    svg.appendChild(g); refs.spec[id] = g;

    const bt = el("text", { x: n.x + n.w + 6, y: n.y + 9, class: "bind", opacity: 0 });
    if (M.bindings[id]) {
      let dy = 0;
      for (const k in M.bindings[id]) {
        const ln = el("tspan", { x: n.x + n.w + 6, dy: dy ? 9 : 0 }); ln.textContent = `${k} ${M.bindings[id][k]}`; bt.appendChild(ln); dy = 9;
      }
    }
    svg.appendChild(bt); refs.bind[id] = bt;
  }

  // step nodes + forecast + agent labels
  for (const id in STEP) {
    const s = STEP[id], cx = scx(id), cy = scy(id);
    const g = el("g");
    const r = el("rect", { x: s.bx, y: cy - SH / 2, width: SW, height: SH, rx: 6,
      fill: s.opt ? "var(--opt-fill)" : "var(--cream)", stroke: s.opt ? "var(--opt-edge)" : "var(--cream-edge)", "stroke-width": 1.2 });
    if (s.opt) r.setAttribute("stroke-dasharray", "4 3");
    g.appendChild(r);
    const t = el("text", { x: cx, y: cy + 4, class: "node-label", "text-anchor": "middle",
      fill: s.opt ? "var(--opt-ink)" : "var(--cream-ink)" }); t.textContent = id;
    g.appendChild(t);
    svg.appendChild(g); refs.step[id] = g;

    const fc = el("text", { x: cx, y: cy + SH / 2 + 11, class: "fc", "text-anchor": "middle", opacity: 0 });
    const f = M.forecasts[id];
    if (f && f.metrics.duration_h) {
      const d = f.metrics.duration_h, df = f.metrics.defects;
      fc.textContent = `${d.mean}h ±${d.sd}` + (df ? ` · ${df.mean} def` : "");
    }
    svg.appendChild(fc); refs.fc[id] = fc;

    const ag = el("text", { x: cx, y: cy - SH / 2 - 5, class: "agent", "text-anchor": "middle", opacity: 0 });
    ag.textContent = M.topAgent[id] ? M.topAgent[id] : "";
    svg.appendChild(ag); refs.agent[id] = ag;
  }
}

/* ---- stage visibility ------------------------------------------------------ */
function set(e, o) { if (e) e.setAttribute("opacity", o); }
function applyStage(M, stage) {
  const chosen = new Set(M.P), inNP = new Set(M.N_P);
  const focusSteps = new Set(stage === 5 ? M.focus.steps : []);
  const inducedKeys = new Set(M.arcs.map(e => e.u + "_" + e.v));

  // spec nodes: chosen highlighted; dim everything slightly from stage 3 on
  for (const id in refs.spec) {
    const base = chosen.has(id) ? 1 : 0.45;
    set(refs.spec[id], stage >= 3 ? base * 0.92 : base);
  }
  // bindings from stage 2
  for (const id in refs.bind) set(refs.bind[id], stage >= 2 && chosen.has(id) ? 1 : 0);

  // process panel fades in at stage 3
  set(refs.process, stage >= 3 ? 1 : 0.1);

  // steps
  for (const id in refs.step) {
    let o = 0.3;
    if (stage >= 3 && inNP.has(id)) o = stage === 5 ? (focusSteps.has(id) ? 1 : 0.4) : 1;
    else if (stage >= 3) o = 0.4;
    set(refs.step[id], o);
  }
  // arcs
  for (const key in refs.arc) {
    const induced = inducedKeys.has(key);
    let o = stage >= 3 ? (induced ? 1 : 0.28) : 0.2;
    if (stage === 5 && induced) {
      const { u, v } = refs.arc[key];
      const boundary = focusSteps.has(u) !== focusSteps.has(v);
      const internal = focusSteps.has(u) && focusSteps.has(v);
      o = boundary || internal ? 1 : 0.35;
    }
    set(refs.arc[key].el, o);
  }
  // mu links: strong at stage 3, faint after
  refs.mu.forEach(({ el }) => set(el, stage === 3 ? 0.65 : stage > 3 ? 0.14 : 0));
  // forecasts from stage 3
  for (const id in refs.fc) set(refs.fc[id], stage >= 3 && inNP.has(id) && (stage !== 5 || focusSteps.has(id)) ? 1 : 0);
  // top agent from stage 4
  for (const id in refs.agent) set(refs.agent[id], stage >= 4 && inNP.has(id) && (stage !== 5 || focusSteps.has(id)) ? 1 : 0);
  // product labels only at stage 5 on focus-job boundary arcs
  for (const key in refs.prod) {
    const { u, v } = refs.arc[key];
    const show = stage === 5 && inducedKeys.has(key) && (focusSteps.has(u) !== focusSteps.has(v));
    set(refs.prod[key], show ? 1 : 0);
    if (show) refs.prod[key].textContent = (ARC[key] && M.arcs.find(e => e.u === u && e.v === v)?.product) || "";
  }
}

/* ---- captions -------------------------------------------------------------- */
function caption(M, stage) {
  const all = SPD.spec.N.map(n => n.id);
  const excluded = all.filter(x => !M.P.includes(x));
  const bindStr = M.P.filter(x => Object.keys(M.bindings[x]).length)
    .map(x => `<b>${x}</b> (${Object.entries(M.bindings[x]).map(([k, v]) => `${k} ${v}`).join(", ")})`).join("; ");
  const fcStr = M.N_P.map(s => { const d = M.forecasts[s].metrics.duration_h; return `<b>${s}</b> ${d ? d.mean + "h" : "?"}`; }).join(", ");
  const eligStr = M.N_P.map(s => `<b>${s}</b>: ${M.eligibility[s].map(e => e.a + "(" + e.n_a + ")").join(" ")}`).join("<br>");
  const f = M.focus;
  const inP = f ? f.in.map(e => e.product).join(", ") || "—" : "—";
  const outP = f ? f.out.map(e => e.product).join(", ") || "—" : "—";

  const S = [
    null,
    { h: "Stage 1 · Selection", f: "P ⊆ N", b: `A project is a random subset of the specification nodes. Here <b>P = { ${M.P.join(", ")} }</b>` + (excluded.length ? `, leaving out ${excluded.join(", ")}.` : ".") },
    { h: "Stage 2 · Binding", f: "D bound to values", b: `Each chosen node's descriptors take values on this instance: ${bindStr || "—"}.` },
    { h: "Stage 3 · Derivation &amp; forecast", f: "G_P = G[N_P],  N_P = ⋃ μ(x)", b: `The nodes necessitate steps <b>N_P = { ${M.N_P.join(", ") || "—"} }</b> (dashed links), inducing the subgraph. forecast(s,D) is fitted from the trace: ${fcStr}.` },
    { h: "Stage 4 · Selection stimulus", f: "Elig(s),  nₐ(s)", b: `Eligible agents per step, ranked by recorded experience nₐ(s):<br>${eligStr}` },
    { h: "Stage 5 · Contract", f: "C(j) = (in(j), out(j), φ(j))", b: f ? `Honing in on job <b>${f.job}</b> over steps ${f.steps.join(", ")}. in = ${inP}; out = ${outP}; φ is the forecast over its steps. Offered to every eligible agent, binding on whoever self-selects.` : "No job to show." },
  ];
  const c = S[stage];
  document.getElementById("capHead").innerHTML = c.h;
  document.getElementById("capFormula").textContent = c.f.replace(/&amp;/g, "&");
  document.getElementById("capBody").innerHTML = c.b;
}

/* ---- driver ---------------------------------------------------------------- */
let model, stage = 1;
const MAXSTAGE = 5;

function firstGoodSeed() {
  for (let s = 1; s < 500; s++) { const m = deriveProject(s); if (m.N_P.length >= 3 && m.N_P.length <= 6) return s; }
  return 1;
}
function rerollSeed() {
  for (let i = 0; i < 60; i++) { const s = Math.floor(Math.random() * 1e6); if (deriveProject(s).N_P.length >= 2) return s; }
  return firstGoodSeed();
}

function render() {
  applyStage(model, stage);
  caption(model, stage);
  document.getElementById("back").disabled = stage <= 1;
  document.getElementById("next").disabled = stage >= MAXSTAGE;
  document.getElementById("seed").textContent = "seed " + model.seed;
  const dots = document.getElementById("dots"); dots.innerHTML = "";
  for (let i = 1; i <= MAXSTAGE; i++) { const d = el2("span", "dot" + (i === stage ? " on" : "")); dots.appendChild(d); }
}
function el2(t, cls) { const e = document.createElement(t); e.className = cls; return e; }

function load(seed) { model = deriveProject(seed); buildDiagram(model); stage = 1; render(); }

document.getElementById("next").onclick = () => { if (stage < MAXSTAGE) { stage++; render(); } };
document.getElementById("back").onclick = () => { if (stage > 1) { stage--; render(); } };
document.getElementById("reroll").onclick = () => load(rerollSeed());
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") document.getElementById("next").click();
  if (e.key === "ArrowLeft") document.getElementById("back").click();
});

if (!SPD) {
  document.getElementById("capBody").textContent = "model_bundle.js not found. Run: python main.py bundle";
} else {
  load(firstGoodSeed());
}
</script>
</body>
